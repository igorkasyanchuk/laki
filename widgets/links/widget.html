<style>
  /* the links in a row from the left (Laki's linkbar: a thin rule between them, wrapping when they don't fit) */
  .links { height: 100%; display: flex; align-items: safe center; overflow: hidden auto; padding: 2px 0; }
  .links .linkbar { width: 100%; }
  .links .linkbar > a { font-size: 11.5px; border-radius: 0; } /* the sidebar foot's words (.ib.labeled) */
</style>
<template preview>
  <div class="links"><div class="linkbar" id="links"></div></div>
  <script>
    // each chip: "Label: https://…" (or = or |), or a bare URL (its host as the label)
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
    const links = (laki.config.links || []).map(x => {
      const m = /^(.*?)\s*[:=|]?\s*((?:https?:\/\/|mailto:)\S+)$/i.exec(x.trim())
      if (!m) return null
      let label = m[1].trim()
      try { label ||= new URL(m[2]).hostname.replace(/^www\./, '') || m[2].replace(/^mailto:/i, '') } catch { return null }
      return { label, url: m[2] }
    }).filter(Boolean)
    document.getElementById('links').innerHTML = links.length
      ? links.map(l => `<a href="${esc(l.url)}" title="${esc(l.url)}">${esc(l.label)}</a>`).join('')
      : '<span class="muted small">Add links in Settings › Widgets: Label: https://…</span>'
  </script>
</template>
