# Typecheck, build and every test (npm test) on Linux, as scripts/linux.sh runs them in Docker. ponytail: no macOS runner
# (10x the minutes on a private repo); docs/release.md's checks run the Mac's before each release
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq lsof
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx electron-vite build
      - run: npm test
