<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- V15: the tile under the mark, src/renderer/src/icon.svg's on Icon Composer's 1024 canvas (macOS 26 cuts the
       shape). Laki.icon takes its two colors as its fill (a fill is colors there, not a picture) -->
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1d26"/><stop offset="1" stop-color="#0b0c11"/></linearGradient></defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
</svg>
