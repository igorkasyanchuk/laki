<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Laki</title>
    <style>
      /* the theme's colors come with the cards (main's floats.colors: the app window's); these until then */
      :root { --bg: #161a21; --fg: #d5d9e3; --muted: #7a8294; --line: #232833; --waiting: #e0af68; --done: #9ece6a; --error: #f7768e; --accent: #7aa2f7; --font: -apple-system, system-ui, sans-serif; color-scheme: dark; }
      html, body { margin: 0; background: transparent; color: var(--fg); font: 12.5px/1.4 var(--font); }
      body { box-sizing: border-box; max-height: 100vh; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
      .card { position: relative; display: flex; flex-direction: column; gap: 7px; padding: 11px 12px 12px; background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--waiting); border-radius: 10px; box-shadow: 0 6px 24px rgb(0 0 0 / 0.35), 0 0 0 0.5px rgb(0 0 0 / 0.4); }
      .card.ok { border-left-color: var(--done); } .card.bad { border-left-color: var(--error); } .card.info { border-left-color: var(--accent); }
      .card.ok .dot { background: var(--done); animation: none; } .card.bad .dot { background: var(--error); animation: none; } .card.info .dot { background: var(--accent); animation: none; }
      .all { display: flex; justify-content: flex-end; padding: 0 4px; }
      .all .open { padding: 3px 9px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); font-size: 11px; box-shadow: 0 2px 8px rgb(0 0 0 / 0.3); }
      .all .open:hover { color: var(--fg); text-decoration: none; }
      .card.new { animation: in 0.28s cubic-bezier(0.3, 1.3, 0.5, 1); }
      @keyframes in { from { opacity: 0; transform: translateX(40px); } }
      .head { display: flex; align-items: center; gap: 7px; min-width: 0; padding-right: 22px; }
      .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--waiting); animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.35; } }
      .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .x { position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; display: grid; place-items: center; padding: 0; border: none; border-radius: 6px; background: none; color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer; }
      .x:hover { background: color-mix(in srgb, var(--muted) 18%, transparent); color: var(--fg); }
      .what { margin: 0; padding: 7px 9px; background: color-mix(in srgb, #000 22%, var(--bg)); border: 1px solid var(--line); border-radius: 7px; font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 96px; overflow: auto; user-select: text; }
      .diff { margin: 0; padding: 4px 0; max-height: 170px; overflow: auto; background: color-mix(in srgb, #000 22%, var(--bg)); border: 1px solid var(--line); border-radius: 7px; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; user-select: text; }
      .diff > div { padding: 0 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .diff .a { color: #9ece6a; background: rgb(158 206 106 / 0.1); } .diff .d { color: #f7768e; background: rgb(247 118 142 / 0.1); } .diff .m { color: var(--muted); }
      .opts { display: flex; flex-direction: column; gap: 4px; }
      button.opt { font: inherit; color: var(--fg); text-align: left; padding: 5px 10px; background: color-mix(in srgb, #000 22%, var(--bg)); border: 1px solid var(--line); border-radius: 7px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      button.opt:hover { border-color: var(--accent); }
      button.opt.first { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
      button.opt:disabled { opacity: 0.4; cursor: default; }
      .foot { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
      .foot .err { color: var(--waiting); }
      .open { margin-left: auto; font: inherit; color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; }
      .open:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/ask.ts"></script>
  </body>
</html>
