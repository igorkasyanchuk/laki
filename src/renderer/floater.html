<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Laki</title>
    <style>
      :root { --bg: #161a21; --fg: #d5d9e3; --muted: #7a8294; --line: #232833; --running: #7aa2f7; --waiting: #e0af68; --font: -apple-system, system-ui, sans-serif; color-scheme: dark; }
      html, body { margin: 0; background: transparent; overflow: hidden; color: var(--fg); font: 12px/1.35 var(--font); user-select: none; -webkit-user-select: none; }
      /* the bar: 44px wide (main's BAR); the card, in its own window (#card) */
      #bar { width: 44px; box-sizing: border-box; padding: 0 0 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 22px; }
      body[data-mode='card'] #bar, body[data-mode='bar'] #card { display: none; }
      .grip { width: 100%; height: 14px; display: flex; align-items: flex-end; justify-content: center; cursor: grab; -webkit-app-region: drag; }
      .grip::before { content: ''; width: 14px; height: 3px; border-top: 1px solid var(--muted); border-bottom: 1px solid var(--muted); opacity: 0.7; }
      .dot { --c: var(--running); position: relative; width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--c); display: grid; place-items: center; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: var(--ink, var(--fg)); background: color-mix(in srgb, var(--c) 16%, var(--bg)); cursor: pointer; }
      .dot:hover { background: color-mix(in srgb, var(--c) 34%, var(--bg)); }
      .dot.waiting { --c: var(--waiting); animation: pulse 1.6s ease-in-out infinite; }
      /* working: an arc going round */
      .dot.running::after { content: ''; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--c); animation: spin 1.4s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 35%, transparent); } }
      #card { width: 240px; box-sizing: border-box; padding: 9px 11px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
      #card b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #card .meta { color: var(--muted); font-size: 11px; margin-top: 1px; }
      #card .meta i { font-style: normal; color: var(--c); }
      #card .last { margin-top: 6px; color: var(--fg); opacity: 0.85; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="bar"><div class="grip" title="Drag to move"></div></div>
    <div id="card"></div>
    <script type="module" src="/src/floater.ts"></script>
  </body>
</html>
