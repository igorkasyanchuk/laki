<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Laki</title>
    <style>
      :root { --bg: #161a21; --fg: #d5d9e3; --muted: #7a8294; --line: #232833; --running: #7aa2f7; --waiting: #e0af68; --done: #9ece6a; --idle: var(--muted); --accent: #7aa2f7; --font: -apple-system, system-ui, sans-serif; color-scheme: dark; }
      html, body { margin: 0; background: transparent; overflow: hidden; color: var(--fg); font: 12px/1.35 var(--font); user-select: none; -webkit-user-select: none; }
      body:not([data-mode='bar']) #bar, body:not([data-mode='card']) #card, body:not([data-mode='voice']) #voice, body:not([data-mode='menu']) #menu { display: none; }
      /* the drop: 44px wide (main's BAR), against the screen's edge (data-side); its shape (.shape) melts into the edge
         at the top and bottom (the flares), wobbles a little, and is a round blob while it's dragged */
      #bar { position: relative; isolation: isolate; width: 44px; box-sizing: border-box; padding: 20px 0 20px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: grab; touch-action: none; animation: fl-in 0.35s cubic-bezier(0.3, 1.4, 0.5, 1); }
      body[data-side='left'] #bar { padding: 20px 6px 20px 0; animation-name: fl-in-left; }
      body.dragging #bar { cursor: grabbing; }
      .shape { position: absolute; z-index: -1; top: 14px; bottom: 14px; right: 0; width: 38px; background: var(--bg); border-radius: 19px 0 0 19px / 22px 0 0 22px; filter: drop-shadow(0 0 0.6px var(--muted)) drop-shadow(0 2px 5px rgb(0 0 0 / 0.3)); animation: fl-wobble 7s ease-in-out infinite; transition: border-radius 0.25s; }
      body[data-side='left'] .shape { right: auto; left: 0; transform: scaleX(-1); }
      /* the flares: a quarter circle cut out of a square, where the drop meets the edge */
      .shape::before, .shape::after { content: ''; position: absolute; right: 0; width: 12px; height: 12px; transition: opacity 0.2s; }
      .shape::before { top: -12px; background: radial-gradient(circle at 0 0, transparent 11.5px, var(--bg) 12px); }
      .shape::after { bottom: -12px; background: radial-gradient(circle at 0 100%, transparent 11.5px, var(--bg) 12px); }
      body.dragging .shape { animation: none; border-radius: 19px; }
      body.dragging .shape::before, body.dragging .shape::after { opacity: 0; }
      @keyframes fl-wobble { 0%, 100% { border-radius: 19px 0 0 19px / 22px 0 0 22px; } 33% { border-radius: 16px 0 0 21px / 19px 0 0 27px; } 66% { border-radius: 21px 0 0 17px / 26px 0 0 20px; } }
      @keyframes fl-in { from { transform: translateX(40px); } }
      @keyframes fl-in-left { from { transform: translateX(-40px); } }
      /* on the top or bottom edge: a row 44px high (main's BAR), as wide as what's in it; the shape's round side and its
         flares turned, flipped for the bottom */
      body:is([data-side='top'], [data-side='bottom']) #bar { width: max-content; height: 44px; flex-direction: row; padding: 0 20px 6px; animation-name: fl-in-top; }
      body[data-side='bottom'] #bar { padding: 6px 20px 0; animation-name: fl-in-bottom; }
      body:is([data-side='top'], [data-side='bottom']) .shape { top: 0; bottom: auto; left: 14px; right: 14px; width: auto; height: 38px; border-radius: 0 0 22px 22px / 0 0 19px 19px; animation-name: fl-wobble-h; }
      body[data-side='bottom'] .shape { top: auto; bottom: 0; transform: scaleY(-1); }
      body:is([data-side='top'], [data-side='bottom']) .shape::before { top: 0; right: auto; left: -12px; background: radial-gradient(circle at 0 100%, transparent 11.5px, var(--bg) 12px); }
      body:is([data-side='top'], [data-side='bottom']) .shape::after { top: 0; bottom: auto; right: -12px; background: radial-gradient(circle at 100% 100%, transparent 11.5px, var(--bg) 12px); }
      body:is([data-side='top'], [data-side='bottom']).dragging .shape { animation: none; border-radius: 19px; } /* over the row's wobble */
      @keyframes fl-wobble-h { 0%, 100% { border-radius: 0 0 22px 22px / 0 0 19px 19px; } 33% { border-radius: 0 0 27px 19px / 0 0 21px 16px; } 66% { border-radius: 0 0 20px 26px / 0 0 17px 21px; } }
      @keyframes fl-in-top { from { transform: translateY(-40px); } }
      @keyframes fl-in-bottom { from { transform: translateY(40px); } }
      .fl-dot, .fl-btn { cursor: pointer; transition: transform 0.12s; }
      body.dragging :is(.fl-dot, .fl-btn) { cursor: grabbing; }
      /* hovered (.hot, floater.ts: :hover comes back as the bar does, after a click brought Laki in front): brighter and a
         little bigger (macOS shows another app's pointer shapes only while it's the active one) */
      .fl-dot.hot { filter: brightness(1.35); transform: scale(1.1); } /* over any style's background, a gradient's too */
      .fl-btns { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .fl-dot + .fl-btns { margin-top: 2px; padding-top: 8px; border-top: 1px solid var(--line); }
      .fl-btn { width: 26px; height: 26px; box-sizing: border-box; display: grid; place-items: center; border-radius: 50%; color: var(--muted); border: 1.5px dashed color-mix(in srgb, var(--muted) 55%, transparent); background: var(--bg); }
      .fl-btn.hot { color: var(--fg); border-style: solid; border-color: var(--accent); transform: scale(1.1); }
      .fl-btn svg { width: 14px; height: 14px; }
      /* the +: turns into × while open (its stack, or its menu beside the drop); the stack's actions over it */
      .fl-btn[data-act='plus'] { transition: transform 0.2s, background 0.2s; }
      .fl-btn[data-act='plus'].on { transform: rotate(45deg); color: var(--bg); background: var(--accent); border: 1.5px solid var(--accent); }
      .fl-btn[data-act='plus'].on.hot { transform: rotate(45deg) scale(1.1); }
      .fl-acts { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 8px; margin-bottom: 2px; border-bottom: 1px solid var(--line); }
      .fl-acts .fl-btn { color: var(--fg); border: 1px solid color-mix(in srgb, var(--muted) 45%, transparent); }
      .fl-acts .fl-btn svg { width: 13px; height: 13px; }
      .fl-acts.pop .fl-btn { animation: fl-pop 0.2s cubic-bezier(0.3, 1.4, 0.5, 1) backwards; }
      .fl-acts.pop .fl-btn:nth-child(3) { animation-delay: 30ms; } .fl-acts.pop .fl-btn:nth-child(2) { animation-delay: 60ms; } .fl-acts.pop .fl-btn:nth-child(1) { animation-delay: 90ms; }
      @keyframes fl-pop { from { opacity: 0; transform: translateY(8px) scale(0.6); } }
      /* a row: the + and its stack after the circles, the stack to the +'s left */
      body:is([data-side='top'], [data-side='bottom']) :is(.fl-btns, .fl-acts) { flex-direction: row; }
      body:is([data-side='top'], [data-side='bottom']) .fl-dot + .fl-btns { margin: 0 0 0 2px; padding: 0 0 0 8px; border-top: none; border-left: 1px solid var(--line); }
      body:is([data-side='top'], [data-side='bottom']) .fl-acts { margin: 0 2px 0 0; padding: 0 8px 0 0; border-bottom: none; border-right: 1px solid var(--line); }
      body:is([data-side='top'], [data-side='bottom']) .fl-acts.pop .fl-btn { animation-name: fl-pop-x; }
      @keyframes fl-pop-x { from { opacity: 0; transform: translateX(8px) scale(0.6); } }
      /* the + menu beside the drop (main's MENU: 236 by 196; the rows share its height) */
      #menu { box-sizing: border-box; height: 100vh; padding: 6px; display: flex; flex-direction: column; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
      .m-row { flex: 1; display: flex; align-items: center; gap: 10px; width: 100%; padding: 0 8px; border: none; border-radius: 8px; background: transparent; color: var(--fg); text-align: left; cursor: pointer; font: inherit; outline: none; }
      .m-row:focus { background: color-mix(in srgb, var(--fg) 7%, var(--bg)); }
      .m-ic { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
      .m-ic svg { width: 15px; height: 15px; }
      .m-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
      .m-t { font-size: 13px; font-weight: 500; line-height: 16px; }
      .m-h { font-size: 11.5px; line-height: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .m-k { flex: none; font-size: 11px; line-height: 17px; padding: 0 5px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; }
      #card { width: 280px; box-sizing: border-box; padding: 9px 11px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
      #card.tip { width: max-content; max-width: 240px; padding: 5px 9px; }
      #card b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #card .meta { color: var(--muted); font-size: 11px; margin-top: 1px; }
      #card .meta i { font-style: normal; color: var(--c); }
      #card .row { margin-top: 3px; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #card .pr { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; }
      #card .pr .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #card .pr .sub { flex-basis: 100%; color: var(--muted); font-size: 11px; }
      #card .st { font-size: 10px; padding: 0 5px; border-radius: 8px; border: 1px solid currentColor; color: var(--muted); }
      #card .st.open { color: var(--tcgreen, var(--done)); }
      #card .st.merged { color: var(--tcpurple, var(--accent)); }
      #card .st.closed { color: var(--tcred, var(--waiting)); }
      #card .perm { margin-top: 3px; color: var(--fg); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      #card .perm .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
      #card .last { margin-top: 6px; color: var(--fg); opacity: 0.85; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      /* the voice prompt (main's VOICE: 320 by 186) */
      #voice { box-sizing: border-box; height: 186px; display: flex; flex-direction: column; gap: 7px; padding: 10px 11px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; user-select: text; -webkit-user-select: text; }
      .v-head { display: flex; align-items: center; justify-content: space-between; }
      #voice button, #voice select, #voice textarea { font: inherit; color: var(--fg); background: color-mix(in srgb, var(--fg) 6%, var(--bg)); border: 1px solid var(--line); border-radius: 7px; }
      #voice button { cursor: pointer; padding: 4px 10px; }
      #voice button:hover { border-color: var(--muted); }
      .v-x { border: none !important; background: none !important; color: var(--muted) !important; font-size: 16px !important; line-height: 1; padding: 0 2px !important; }
      #voice textarea { flex: 1; resize: none; padding: 6px 8px; outline: none; }
      #voice textarea:focus { border-color: var(--accent); }
      .v-row { display: flex; gap: 6px; }
      .v-row select { flex: 1; min-width: 0; padding: 3px 6px; }
      .v-row select[hidden] + .v-mic { margin-left: auto; } /* always a new session: no list */
      .v-mic { display: grid; place-items: center; padding: 4px 7px !important; }
      .v-mic svg { width: 14px; height: 14px; }
      #voice .v-send { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
      #voice .v-send:disabled { opacity: 0.6; cursor: default; }
      .v-note { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .v-note.bad { color: var(--waiting); white-space: normal; }
      /* the reply window (a circle's Reply…): its last answer dimmed, a waiting one's options; as tall as it needs (main
         sizes it from VOICE) */
      #voice.reply { height: auto; min-height: 186px; }
      .v-last { color: var(--muted); border-left: 2px solid var(--line); padding: 1px 0 1px 8px; white-space: pre-line; max-height: 64px; overflow: auto; overflow-wrap: anywhere; }
      .v-opts { display: flex; flex-direction: column; gap: 4px; }
      .v-opts .v-opt { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #card .hint { margin-top: 7px; padding-top: 5px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
      /* the island (floaterAt notch): the bar is a black pill under the menu bar or around the notch, its bottom corners
         round; a thin bar per agent on the left, how many need you on the right; its cards in #island */
      body[data-at='notch'] #bar { width: 100vw; height: 100vh; padding: 0 14px; box-sizing: border-box; flex-direction: row; align-items: center; gap: 0; background: #000; border-radius: 0 0 14px 14px; cursor: default; animation: none; }
      body[data-at='notch'] .shape { display: none; }
      .isl-bars { display: flex; gap: 3px; align-items: center; height: 14px; }
      .isl-b { width: 3px; height: 12px; border-radius: 2px; background: var(--ink, var(--running)); opacity: 0.85; }
      .isl-b.idle { opacity: 0.35; height: 8px; }
      .isl-b.done { background: var(--done); }
      .isl-b.waiting { background: var(--waiting); animation: isl-pulse 1.4s ease-in-out infinite; }
      @keyframes isl-pulse { 50% { opacity: 0.35; } }
      .isl-gap { flex: 1; }
      .isl-n { min-width: 14px; font-weight: 600; color: var(--done); text-align: right; }
      .isl-n.waiting { color: var(--waiting); }
      .isl-n:not(:empty)::before { content: '●'; margin-right: 5px; font-size: 9px; vertical-align: 1px; }
      #island { box-sizing: border-box; width: 400px; padding: 12px 14px; background: #000; color: #e8eaf0; border-radius: 0 0 18px 18px; display: flex; flex-direction: column; gap: 8px; user-select: text; -webkit-user-select: text; }
      body:not([data-mode='card']) #island, body[data-mode='card'] #island:empty { display: none; }
      body[data-mode='card'] #card:empty { display: none; }
      .i-head { display: flex; align-items: baseline; gap: 4px; min-width: 0; }
      .i-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ink, var(--running)); align-self: center; }
      .i-dot.waiting { background: var(--waiting); } .i-dot.done { background: var(--done); } .i-dot.idle { opacity: 0.4; }
      .i-ws { color: #9aa0ad; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .i-right { margin-left: auto; color: #9aa0ad; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .i-q { font-size: 13px; }
      .i-what { margin: 0; padding: 8px 10px; background: #15171c; border: 1px solid #262a33; border-radius: 8px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 110px; overflow: auto; }
      .i-diff { margin: 0; padding: 4px 0; max-height: 180px; overflow: auto; background: #15171c; border: 1px solid #262a33; border-radius: 8px; font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .i-diff > div { padding: 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; } .i-diff .a { color: #9ece6a; background: rgba(158, 206, 106, 0.1); } .i-diff .d { color: #f7768e; background: rgba(247, 118, 142, 0.1); } .i-diff .m { color: #9aa0ad; }
      .i-opts { display: flex; flex-direction: column; gap: 4px; }
      #island button { font: inherit; color: #e8eaf0; background: #15171c; border: 1px solid #262a33; border-radius: 8px; padding: 5px 10px; cursor: pointer; text-align: left; }
      #island button:hover { border-color: #4a5060; }
      #island .i-opt.primary { border-color: var(--accent); }
      #island button:disabled { opacity: 0.35; cursor: default; }
      .i-answer { white-space: pre-line; font-size: 13px; }
      .i-sub, .i-note { color: #9aa0ad; font-size: 11px; }
      .i-note:empty { display: none; } .i-note.bad { color: var(--waiting); }
      .i-foot { display: flex; gap: 6px; align-items: center; }
      .i-dots { margin-left: auto; color: #9aa0ad; font-size: 11px; cursor: pointer; }
      .i-reply { display: flex; gap: 6px; align-items: flex-end; background: #15171c; border: 1px solid #262a33; border-radius: 10px; padding: 5px 6px 5px 10px; }
      .i-reply textarea { flex: 1; resize: none; border: none; outline: none; background: none; color: inherit; font: inherit; min-height: 20px; }
      #island .i-send { padding: 2px 8px; border-radius: 50%; background: var(--accent); color: #000; border: none; font-weight: 700; }
      .i-title { color: #9aa0ad; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
      .i-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; align-items: center; }
      .i-main { cursor: pointer; padding: 4px 6px; border-radius: 7px; min-width: 0; }
      .i-main:hover { background: #15171c; }
      #island .i-chev { padding: 2px 8px; transition: transform 0.15s; }
      #island .i-chev.on { transform: rotate(90deg); }
      .i-more { grid-column: 1 / -1; color: #9aa0ad; white-space: pre-line; padding: 0 6px 4px 20px; }
      @media (prefers-reduced-motion: reduce) { .isl-b.waiting { animation: none; } #island .i-chev { transition: none; } }
      @media (prefers-reduced-motion: reduce) { #bar, .shape, .fl-acts .fl-btn { animation: none; } .fl-dot, .fl-btn { transition: none; } }
    </style>
  </head>
  <body data-side="right" data-fstyle="glow">
    <div id="bar"><div class="shape"></div></div>
    <div id="card"></div>
    <div id="island"></div>
    <div id="menu" role="menu" aria-label="New"></div>
    <div id="voice">
      <div class="v-head"><b>Say a prompt</b><button class="v-x" title="Close (Esc)">×</button></div>
      <div class="v-last" hidden></div>
      <div class="v-opts" hidden></div>
      <textarea spellcheck="false" placeholder="Speak, or type…"></textarea>
      <div class="v-row">
        <select title="Who gets it"></select>
        <button class="v-mic" title="Dictate again"></button>
        <button class="v-send">Send</button>
      </div>
      <div class="v-note">Dictation starts by itself · ⏎ sends · ⇧⏎ a new line · Esc closes</div>
    </div>
    <script type="module" src="/src/floater.ts"></script>
  </body>
</html>
