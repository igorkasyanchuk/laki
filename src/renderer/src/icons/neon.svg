    <path d="M262 680 L512 414 L762 680" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="716" cy="282" r="70" fill="#f472b6" filter="url(#glow)"/>
    <circle cx="716" cy="282" r="50" fill="#f9a8d4"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
