    <linearGradient id="n" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <g clip-path="url(#t)">
    <rect x="100" y="100" width="824" height="824" fill="#07070d"/>
    <path d="M100 760 H924" stroke="#e879f9" stroke-opacity="0.18" stroke-width="4"/>
