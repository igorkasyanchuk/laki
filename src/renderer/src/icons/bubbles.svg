    <circle cx="368" cy="622" r="132" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="10"/>
    <circle cx="656" cy="622" r="132" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="10"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
