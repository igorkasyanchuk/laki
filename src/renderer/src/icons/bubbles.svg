    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2a8f"/><stop offset="1" stop-color="#111538"/></linearGradient>
    <radialGradient id="a" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffd08a"/><stop offset="1" stop-color="#ff7a45"/></radialGradient>
    <radialGradient id="b" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#a8c4ff"/><stop offset="1" stop-color="#5b7cfa"/></radialGradient>
    <radialGradient id="c" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#b6f2c8"/><stop offset="1" stop-color="#3fbf7a"/></radialGradient>
  </defs>
  <g clip-path="url(#t)">
    <rect x="100" y="100" width="824" height="824" fill="url(#g)"/>
    <circle cx="512" cy="372" r="132" fill="url(#a)"/>
    <circle cx="368" cy="622" r="132" fill="url(#b)"/>
