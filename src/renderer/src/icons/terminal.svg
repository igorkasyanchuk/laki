    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232733"/><stop offset="1" stop-color="#0d0f14"/></linearGradient>
  </defs>
  <g clip-path="url(#t)">
    <rect x="100" y="100" width="824" height="824" fill="url(#g)"/>
    <rect x="100" y="100" width="824" height="170" fill="#2c3140"/>
    <circle cx="232" cy="185" r="30" fill="#ff5f57"/><circle cx="322" cy="185" r="30" fill="#febc2e"/><circle cx="412" cy="185" r="30" fill="#28c840"/>
    <path d="M270 420 L450 570 L270 720" fill="none" stroke="#7ee787" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="520" y="676" width="230" height="84" rx="20" fill="#e6edf3"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
