<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
  <!-- Laki (Finnish: a summit): a prompt's caret for the peak, and the sun beside it. build/icon.icns (the app
       icon) is rendered from it (scripts/icon.swift); the splash and the browser tab show it as it is. -->
  <defs><clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1d26"/><stop offset="1" stop-color="#0b0c11"/></linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <path d="M262 680 L512 414 L762 680" fill="none" stroke="#ffffff" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="716" cy="282" r="58" fill="#ff7a45"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
